[package]
name = "cu-tools"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native macOS computer-use tools for agents, with a Rust CLI and MCP server"

[dependencies]
serde_json = "1"
tempfile = "3"
libc = "0.2"
unicode-segmentation = "1"

[[bin]]
name = "cu-mcp"
path = "src/mcp.rs"

[[bin]]
name = "cu"
path = "src/cli.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "cu-input"
path = "src/input.rs"

[[bin]]
name = "cu-native"
path = "src/native.rs"
