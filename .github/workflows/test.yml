name: test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: cu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path cu-runtime/Cargo.toml --check
      - name: Rust unit tests
        run: cargo test --locked --manifest-path cu-runtime/Cargo.toml --all-targets
      - name: Rust lint
        run: cargo clippy --locked --manifest-path cu-runtime/Cargo.toml --all-targets -- -D warnings
      - name: Build standalone Rust tools
        run: cargo build --locked --release --manifest-path cu-runtime/Cargo.toml --bins
      - name: Check shell syntax
        run: zsh -n bin/cu scripts/*.zsh scripts/cu-mcp tests/test_cu.zsh tests/fixtures/mock-*
      - name: Mocked CLI and MCP contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_cu_rust.py'
          CU_TEST_BIN="$PWD/cu-runtime/target/release/cu" ./tests/test_cu.zsh
      - name: Package and isolated install test
        run: |
          ./scripts/build-release.zsh
          ./scripts/test-release.zsh
  msrv:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Minimum supported Rust compiler
        run: cargo check --locked --manifest-path cu-runtime/Cargo.toml --all-targets
