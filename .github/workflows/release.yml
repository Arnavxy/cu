name: release
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' cu-runtime/Cargo.toml | head -1)"
      - name: Rust checks
        run: |
          cargo fmt --manifest-path cu-runtime/Cargo.toml --check
          cargo test --locked --manifest-path cu-runtime/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path cu-runtime/Cargo.toml --all-targets -- -D warnings
      - name: Build archive
        run: ./scripts/build-release.zsh '${{ matrix.target }}'
      - name: Verify archive and isolated installer
        run: ./scripts/test-release.zsh dist/cu-0.5.0-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cu-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c *.sha256
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "CU $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" *.tar.gz *.sha256 --clobber
